name: Deploy TRACE
run-name: Deploy TRACE ${{ inputs.source_sha || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      image:
        description: Reviewed ACR image reference including sha256 digest
        required: true
        type: string
      source_sha:
        description: TRACE source commit (provided by the image workflow)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: trace-development-deployment
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Show deployment candidate
        env:
          IMAGE: ${{ inputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^traceregistrydev-fvc2cwgtdhd3hned\.azurecr\.io/trace@sha256:[a-f0-9]{64}$ ]]
          [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf 'Image: `%s`\nSource: `%s`\n' "$IMAGE" "${SOURCE_SHA:-manual}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$SOURCE_SHA" ]]; then
            printf 'Review source: https://github.com/krispykrits/TRACE/commit/%s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: candidate
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject an outdated automatic deployment
        if: inputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current=$(curl --fail --silent --show-error --retry 3 https://api.github.com/repos/krispykrits/TRACE/commits/main | jq -er .sha)
          [[ "$SOURCE_SHA" == "$current" ]] || { echo 'A newer TRACE commit exists; refusing to deploy this image.' >&2; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.12
      - uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}
          admin: 'false'
          use-kubelogin: 'true'
      - name: Verify prerequisites and deploy reviewed digest
        env:
          TRACE_IMAGE: ${{ inputs.image }}
          TRACE_WORKER_CLIENT_ID: ${{ vars.TRACE_WORKER_CLIENT_ID }}
          TRACE_API_CLIENT_ID: ${{ vars.TRACE_API_CLIENT_ID }}
        run: |
          set -euo pipefail
          kubectl get secret trace-runtime -n trace >/dev/null
          ./scripts/render.sh | kubectl apply -f -
          kubectl rollout status deployment/trace-api -n trace --timeout=5m
          kubectl rollout status deployment/trace-worker -n trace --timeout=5m
